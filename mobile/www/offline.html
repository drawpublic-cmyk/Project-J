<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>존급</title>
  <style>
    html,body{margin:0;height:100%;background:#FDFCF7;font-family:-apple-system,system-ui,sans-serif;color:#1A1A1A}
    body{display:grid;place-items:center;padding:0 24px;box-sizing:border-box}
    .msg{text-align:center;max-width:320px}
    .pin{width:72px;height:72px;margin:0 auto 22px;border-radius:38px 38px 38px 8px;transform:rotate(-45deg);background:#FDFCF7;border:4px solid #06530B;display:grid;place-items:center;box-sizing:border-box}
    .pin span{transform:rotate(45deg);color:#06530B;font-weight:900;font-size:28px}
    h1{font-size:22px;font-weight:900;margin:0}
    p{opacity:.75;margin:10px 0 0;line-height:1.5;font-size:15px;word-break:keep-all}
    button{margin-top:26px;border:0;border-radius:14px;background:#06530B;color:#fff;font-size:16px;font-weight:700;padding:14px 32px}
    button:active{opacity:.8}
  </style>
</head>
<body>
  <!-- capacitor.config.json 의 server.errorPath. 원격 앱(server.url) 로딩 실패(오프라인 등) 시 표시.
       이 페이지는 앱 번들(로컬)에서 서빙되므로 네트워크 없이도 뜸. 안드로이드에선 Capacitor 플러그인 접근 불가. -->
  <div class="msg">
    <div class="pin"><span>급</span></div>
    <h1>인터넷에 연결되어 있지 않아요</h1>
    <p>존급은 주변 화장실·교통 정보를 실시간으로 불러와요.<br>Wi-Fi나 모바일 데이터를 켠 뒤 다시 시도해 주세요.</p>
    <button id="retry">다시 시도</button>
  </div>
  <script>
    var APP_URL = "https://project-j-phi.vercel.app";
    function retry() { location.href = APP_URL; }
    document.getElementById("retry").addEventListener("click", retry);
    window.addEventListener("online", retry);   // 연결 복구되면 자동 재시도
  </script>
</body>
</html>
